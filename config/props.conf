#
# props.conf - sourcetype parsing rules for the Splunk Home Lab
# Place in $SPLUNK_HOME/etc/system/local/ or an app's /local directory,
# then restart Splunk (or use Docker volume mount as configured in
# docker-compose.yml).
#

[linux_secure]
SHOULD_LINEMERGE = false
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
category = Operating System
description = Linux SSH / sudo authentication log (auth.log / secure style)
disabled = false
pulldown_type = true
EXTRACT-auth_fields = ^\w+\s+\d+\s+\S+\s+(?<host>\S+)\s+sshd\[\d+\]:\s+(?<action>Accepted|Failed)\s+(?<auth_method>\S+)\s+for\s+(?:invalid user\s+)?(?<user>\S+)\s+from\s+(?<src_ip>\S+)\s+port\s+(?<src_port>\d+)
EXTRACT-sudo_fields = ^\w+\s+\d+\s+\S+\s+(?<host>\S+)\s+sudo:\s+(?<sudo_user>\S+)\s+:\s+TTY=(?<tty>\S+)\s+;\s+PWD=(?<pwd>\S+)\s+;\s+USER=(?<target_user>\S+)\s+;\s+COMMAND=(?<command>.+)$

[iptables_syslog]
SHOULD_LINEMERGE = false
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
category = Network & Security
description = iptables/netfilter firewall log
disabled = false
pulldown_type = true
EXTRACT-fw_fields = IPTABLES-(?<fw_action>ACCEPT|DROP):\s+IN=(?<in_iface>\S+)\s+OUT=\S*\s+SRC=(?<src_ip>\S+)\s+DST=(?<dst_ip>\S+)\s+PROTO=(?<proto>\S+)\s+SPT=(?<src_port>\d+)\s+DPT=(?<dst_port>\d+)

[access_combined]
SHOULD_LINEMERGE = false
TIME_PREFIX = \[
TIME_FORMAT = %d/%b/%Y:%H:%M:%S %z
MAX_TIMESTAMP_LOOKAHEAD = 30
category = Web
description = Apache/Nginx combined access log
disabled = false
pulldown_type = true
EXTRACT-web_fields = ^(?<src_ip>\S+)\s+\S+\s+\S+\s+\[(?<req_time>[^\]]+)\]\s+"(?<http_method>\S+)\s+(?<uri_path>\S+)\s+\S+"\s+(?<status>\d+)\s+(?<bytes>\d+)\s+"[^"]*"\s+"(?<user_agent>[^"]*)"
