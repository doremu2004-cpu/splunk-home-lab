#
# transforms.conf - supplementary field transforms for the Splunk Home Lab
#
# Most field extraction is handled inline via EXTRACT-* in props.conf.
# This file is included for two optional enrichments used in later
# detection searches. It is safe to onboard data without these
# (searches will still work); they simply add convenience fields.

# Tags well-known scanning / automation user-agents so 05_sql_injection_attempts.spl
# and other searches can flag them quickly with `| lookup`-free logic.
[suspicious_user_agent_regex]
REGEX = (?i)(python-requests|curl|sqlmap|nikto|nmap|masscan|scanner|Go-http-client)
FORMAT = suspicious_agent::1
WRITE_META = true

# Classifies destination ports on firewall events into a human-readable
# service name for dashboard readability.
[well_known_port_lookup]
filename = well_known_ports.csv
